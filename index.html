<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Лили: Dress to Impress 👗</title>
<meta name="theme-color" content="#b06ad8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Подиум Лили">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Nunito","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f3e6ff;display:flex;flex-direction:column;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;position:fixed;top:0;left:0;right:0;width:100%;
}
/* ---------- TOP BAR ---------- */
#topbar{
  flex:0 0 auto;min-height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,#c77fe8,#b06ad8);box-shadow:0 3px 0 #9553bd;z-index:50;
}
#topbar .title{font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 0 #9553bd;letter-spacing:.5px}
#topbar .right{display:flex;align-items:center;gap:8px}
#trbox{background:#fff;border-radius:20px;padding:4px 12px;font-weight:800;color:#c98a1e;font-size:16px;box-shadow:0 2px 0 #9553bd;transition:transform .2s}
#trbox.bump{transform:scale(1.25)}
#sndbtn{width:38px;height:38px;border:none;border-radius:50%;background:#fff;font-size:18px;box-shadow:0 2px 0 #9553bd;cursor:pointer}
/* ---------- STAGE / PHASES ---------- */
#stage{flex:1 1 auto;position:relative;overflow:hidden;background:#faf2ff}
.ph{position:absolute;inset:0;display:none}
.ph.active{display:flex;flex-direction:column}
/* ---------- START ---------- */
#ph-start{align-items:center;justify-content:center;gap:18px;
  background:linear-gradient(180deg,#e9d4ff 0%,#ffd9ec 100%)}
#logoCard{background:#fff;border-radius:28px;padding:30px 34px;text-align:center;box-shadow:0 8px 0 #dcb8ee;max-width:86%}
#logoCard .lg1{font-size:20px;font-weight:800;color:#c77fe8;letter-spacing:2px}
#logoCard .lg2{font-size:30px;font-weight:800;color:#e0568f;margin-top:4px;letter-spacing:1px}
#logoCard .lg3{font-size:14px;font-weight:700;color:#b18aa5;margin-top:10px;line-height:1.5}
#playBtn{border:none;background:linear-gradient(180deg,#ff9ec4,#ff86b5);color:#fff;font-weight:800;font-size:20px;
  padding:15px 44px;border-radius:26px;box-shadow:0 5px 0 #e5749b;cursor:pointer;font-family:inherit}
#playBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #e5749b}
.miniLink{font-weight:800;color:#a678d0;text-decoration:none;background:#fff;padding:8px 16px;border-radius:18px;box-shadow:0 3px 0 #dcb8ee;font-size:14px}
#startChar{width:130px;filter:drop-shadow(0 8px 6px rgba(160,100,180,.3))}
#startChar svg{width:100%;display:block}
/* ---------- REVEAL ---------- */
#ph-reveal{align-items:center;justify-content:center;background:linear-gradient(180deg,#b06ad8,#7b4ea8)}
#themeCard{background:#fff;border-radius:28px;padding:30px 38px;text-align:center;box-shadow:0 8px 0 rgba(90,50,120,.4);animation:popin .5s cubic-bezier(.2,1.6,.5,1)}
#themeCard .t1{font-size:15px;font-weight:800;color:#b18aa5;letter-spacing:2px}
#themeCard .t2{font-size:58px;margin:8px 0}
#themeCard .t3{font-size:26px;font-weight:800;color:#c05a92}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* ---------- DRESS ---------- */
#ph-dress{background:linear-gradient(180deg,#ffe4f0 0%,#f0e2ff 100%)}
#dressTop{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 0;z-index:5}
#themeChip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:13px;color:#c05a92;box-shadow:0 3px 0 rgba(200,140,210,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:16px;color:#7b4ea8;box-shadow:0 3px 0 rgba(200,140,210,.4);min-width:64px;text-align:center}
#timer.hurry{color:#e04f4f;animation:hurry .5s ease-in-out infinite}
@keyframes hurry{50%{transform:scale(1.15)}}
#doneBtn{border:none;background:linear-gradient(180deg,#8fd67f,#6fbf5e);color:#fff;font-weight:800;font-size:15px;
  padding:9px 16px;border-radius:16px;box-shadow:0 3px 0 #57a648;cursor:pointer;font-family:inherit;white-space:nowrap}
#dCharWrap{flex:0 0 40%;display:flex;align-items:center;justify-content:center;position:relative}
#dChar{height:94%;filter:drop-shadow(0 8px 6px rgba(190,120,160,.3))}
#dChar svg{height:100%;display:block}
#dPanel{flex:1 1 auto;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 0 #ecc8e2;display:flex;flex-direction:column;overflow:hidden}
#dTabs{display:flex;gap:5px;padding:10px 8px 4px}
.tab{flex:1;border:none;border-radius:13px;padding:7px 2px;font-size:11px;font-weight:800;color:#b784a8;background:#f9edf5;cursor:pointer;font-family:inherit;min-width:0}
.tab .ticon{display:block;font-size:18px;margin-bottom:1px}
.tab.sel{background:linear-gradient(180deg,#c77fe8,#b06ad8);color:#fff;box-shadow:0 3px 0 #9553bd}
#dBody{flex:1;overflow-y:auto;padding:8px 12px 16px}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:3px solid #f3dcea;border-radius:14px;background:#fff;padding:8px 12px;font-weight:800;font-size:14px;color:#a6699a;cursor:pointer;font-family:inherit}
.opt.sel{border-color:#b06ad8;background:#f6ebff;color:#8a4cb8}
.dot{width:38px;height:38px;border-radius:50%;border:4px solid #f0e2ec;cursor:pointer}
.dot.sel{border-color:#b06ad8;box-shadow:0 0 0 3px #e8d4f8}
.dot.rbw{background:linear-gradient(135deg,#ff9ec4,#ffd97a,#9fe0c0,#9fc9f5)}
/* ---------- RUNWAY ---------- */
#ph-run{background:linear-gradient(180deg,#3a2360 0%,#5c3a8e 70%,#4a2d74 100%);overflow:hidden}
#rwStage{position:absolute;inset:0}
.curtain{position:absolute;top:0;bottom:34%;width:16%;z-index:6}
.curtain.l{left:0;background:repeating-linear-gradient(90deg,#e0568f 0 14px,#c94a80 14px 28px);border-radius:0 0 40px 0}
.curtain.r{right:0;background:repeating-linear-gradient(90deg,#e0568f 0 14px,#c94a80 14px 28px);border-radius:0 0 0 40px}
#valance{position:absolute;left:0;top:0;width:100%;height:44px;z-index:7}
#catwalk{position:absolute;left:14%;right:14%;bottom:8%;height:26%;z-index:2;
  background:linear-gradient(180deg,#f3d9ea,#e0bcd7);border-radius:14px;box-shadow:0 6px 0 #b88aa8;
  clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}
#spots{position:absolute;inset:0;z-index:3;pointer-events:none}
#rwChar{position:absolute;bottom:22%;left:-30%;width:120px;z-index:5;filter:drop-shadow(0 8px 8px rgba(20,10,40,.5))}
#rwChar svg{width:100%;display:block}
#rwChar.go{animation:rwalk 3.6s ease-out forwards}
@keyframes rwalk{0%{left:-30%}55%{left:calc(50% - 60px)}100%{left:calc(50% - 60px)}}
#rwChar.go .bob{animation:rwbob .35s ease-in-out 6}
@keyframes rwbob{50%{transform:translateY(-8px)}}
#audience{position:absolute;left:0;width:100%;bottom:0;height:9%;display:flex;justify-content:space-evenly;align-items:center;font-size:30px;z-index:6;opacity:.95}
#rwTitle{position:absolute;left:50%;top:9%;transform:translateX(-50%);color:#ffd97a;font-weight:800;letter-spacing:3px;font-size:16px;z-index:6;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.flash{position:absolute;font-size:26px;z-index:8;animation:flashp .5s ease-out forwards;pointer-events:none}
@keyframes flashp{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
/* ---------- RESULTS ---------- */
#ph-res{background:linear-gradient(180deg,#e9d4ff 0%,#ffd9ec 100%);align-items:center;justify-content:flex-start;overflow-y:auto;padding:14px 10px 20px;gap:12px}
#judgeCard{background:#fff;border-radius:20px;padding:12px 18px;text-align:center;box-shadow:0 5px 0 #dcb8ee;max-width:92%}
#judgeCard .jstars{font-size:24px;letter-spacing:2px;min-height:30px}
#judgeCard .jtext{font-weight:800;color:#c05a92;font-size:15px;margin-top:4px}
#judgeCard .jtheme{font-weight:700;color:#b18aa5;font-size:12px;margin-top:2px}
#podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:6px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.pchar{filter:drop-shadow(0 5px 4px rgba(160,100,180,.35))}
.pchar svg{width:100%;display:block}
.pname{font-weight:800;font-size:13px;color:#8a4cb8;background:#fff;padding:2px 10px;border-radius:12px;box-shadow:0 2px 0 #dcb8ee}
.pstars{font-size:13px;letter-spacing:1px}
.pblock{border-radius:12px 12px 0 0;width:88px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15);
  background:linear-gradient(180deg,#c77fe8,#a862cc);box-shadow:inset 0 4px 0 rgba(255,255,255,.35)}
.pblock.first{background:linear-gradient(180deg,#ffd44d,#eab52e)}
#againBtn{border:none;background:linear-gradient(180deg,#ff9ec4,#ff86b5);color:#fff;font-weight:800;font-size:18px;
  padding:13px 36px;border-radius:22px;box-shadow:0 5px 0 #e5749b;cursor:pointer;font-family:inherit;margin-top:6px}
#againBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #e5749b}
#winBanner{font-weight:800;font-size:17px;color:#c98a1e;min-height:22px;text-align:center}
/* particles */
.pt{position:fixed;z-index:90;pointer-events:none;animation:fly .9s ease-out forwards;font-size:22px}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
/* responsive */
@media (max-width:374px){
  #topbar .title{font-size:15px}
  .tab{font-size:10px}.tab .ticon{font-size:16px}
  .opt{padding:7px 9px;font-size:13px}
  .pblock{width:74px}
  #rwChar{width:100px}
}
@media (min-width:640px){
  #rwChar{width:170px}
  #dChar{height:100%}
}
#rotate{position:fixed;inset:0;background:linear-gradient(180deg,#c77fe8,#ff9ec4);z-index:500;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;font-weight:800;font-size:20px;text-align:center;padding:24px}
#rotate .phn{font-size:64px;animation:rotph 1.8s ease-in-out infinite}
@keyframes rotph{0%,15%{transform:rotate(-90deg)}55%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:540px){ #rotate{display:flex} }
</style>
</head>

<div id="topbar">

let AC=null,sound=true;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f1,dur,opts={}){
  if(!sound)return; const a=ac(); if(!a)return;
  const {f2=f1,type="sine",vol=.14,delay=0}=opts;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.connect(g);g.connect(a.destination);
  const t=a.currentTime+delay;
  o.frequency.setValueAtTime(f1,t);
  if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t);o.stop(t+dur+.05);
}
const S={
  pop(){tone(520,.12);tone(880,.1,{delay:.06});},
  fanfare(){[523,659,784,1047].forEach((n,i)=>tone(n,.25,{delay:i*.13,type:"triangle",vol:.14}));},
  win(){[523,659,784,1047,1319].forEach((n,i)=>tone(n,.3,{delay:i*.14,type:"triangle",vol:.15}));},
  lose(){[440,392,349].forEach((n,i)=>tone(n,.3,{delay:i*.22,type:"triangle",vol:.1}));},
  tick(){tone(900,.06,{type:"square",vol:.05});},
  flash(){tone(1500,.08,{f2:2000,vol:.06});},
  walk(){[523,587,659,587,659,698,784].forEach((n,i)=>tone(n,.18,{delay:i*.3,type:"triangle",vol:.1}));},
  drum(){for(let i=0;i<8;i++)tone(160+i*8,.07,{delay:i*.1,type:"square",vol:.05});},
  star(){tone(660,.12);tone(880,.12,{delay:.09});tone(1180,.2,{delay:.18});}
};

      if(m.length)return m[0];

    ch.innerHTML=charSVG(s.cfg,"pd"+idx);
    const nm=document.createElement("div");nm.className="pname";nm.textContent=(s.me?"💖 ":"")+s.name;
    const st=document.createElement("div");st.className="pstars";st.textContent="⭐".repeat(s.stars);
    const bl=document.createElement("div");bl.className="pblock"+(idx===0?" first":"");
    bl.style.height=hts[k]+"px";bl.textContent=labels[k];
    col.appendChild(ch);col.appendChild(nm);col.appendChild(st);col.appendChild(bl);
    pod.appendChild(col);
  });
}

document.getElementById("playBtn").addEventListener("click",()=>{S.pop();startRound();});
document.getElementById("doneBtn").addEventListener("click",()=>{S.pop();goRunway();});
document.getElementById("againBtn").addEventListener("click",()=>{S.pop();startRound();});
document.getElementById("startChar").innerHTML=charSVG({hair:4,hairC:0,dress:0,shoes:0,acc:0},"st");

if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
function setVH(){
  const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  if(h)document.body.style.height=Math.round(h)+"px";
}
setVH();
window.addEventListener("resize",setVH);
window.addEventListener("orientationchange",()=>setTimeout(setVH,250));
if(window.visualViewport)window.visualViewport.addEventListener("resize",setVH);
document.addEventListener("touchmove",e=>{
  if(!e.target.closest("#dBody")&&!e.target.closest("#ph-res"))e.preventDefault();
},{passive:false});
</script>
